<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Inventario de Bodega</title>
    <meta name="description" content="Acceso al panel de inventario" />
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container">
        <main class="login-main">
            <section class="card">
                <h2>Acceso Administrador</h2>
                <img src="Img/login-hero.png" alt="Ilustración login" class="login-illustration">
                <p class="muted">Ingrese sus credenciales para administrar el inventario.</p>

                <form id="loginForm">
                    <label>Usuario
                        <input type="text" id="username" required autocomplete="username">
                    </label>
                    <label>Contraseña
                        <input type="password" id="password" required autocomplete="current-password">
                    </label>
                    <p class="form-row">
                        <button type="submit">Iniciar sesión</button>
                    </p>
                    <p id="loginError" class="muted" ></p>
                </form>

                <p class="small-info muted" >Usuario por defecto: <strong>admin</strong> — Contraseña: <strong>admin123</strong></p>
            </section>
        </main>
    </div>

    <script src="Script.js" defer></script>
</body>
</html>
